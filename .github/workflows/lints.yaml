name: Lint

on:
  push:
    branches:
      - main
      - develop
      - release/*
      - hotfix/*
      - feat/*
      - feature/*
      - ci/*

  pull_request:

env:
  CI: 1

jobs:
  format:
    name: Lint format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Install treefmt
        run: nix profile install 'nixpkgs#treefmt'

      - name: Install gofumpt
        run: nix profile install 'nixpkgs#gofumpt'

      - name: Install prettier
        run: nix profile install 'nixpkgs#nodePackages.prettier'

      - name: Install nixfmt
        run: nix profile install 'nixpkgs#nixfmt-rfc-style'

      - name: Install hclfmt
        run: nix profile install 'nixpkgs#hclfmt'

      - name: Install taplo
        run: nix profile install 'nixpkgs#taplo'

      - name: Run shfmt, shellcheck, checkbashisms
        uses: luizm/action-sh-checker@v0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sh_checker_comment: true
          sh_checker_checkbashisms_enable: true

      - name: Run treefmt
        run: |
          treefmt \
            --fail-on-change \
            --no-cache \
            --allow-missing-formatter \
            --formatters go \
            --formatters prettier \
            --formatters nix \
            --formatters toml \
            --formatters shell

  commit:
    name: Lint commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run commitlint
        uses: wagoid/commitlint-github-action@v6.1.2
        with:
          firstParent: false

  codespell:
    name: Codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: codespell-project/codespell-problem-matcher@v1

      - name: Codespell
        uses: codespell-project/actions-codespell@master
