name: "Nix Flakes"

on:
  push:
    branches:
      - main
      - ci/*
      - develop
      - feat/*
      - feature/*
      - hotfix/*
      - release/*

  pull_request:
    paths:
      - "cmd/**"
      - "devshell/**"
      - "internal/**"
      - "pkg/**"
      - flake.lock
      - flake.nix

jobs:
  build-nix-flake:
    name: Build Nix Flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Build Nix Flake
        run: nix build

      - name: Test executable
        run: ./result/bin/norden version
